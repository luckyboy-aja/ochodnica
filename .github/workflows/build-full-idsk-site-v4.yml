name: Build exhaustive 1:1 Ochodnica site

on:
  push:
    paths:
      - '.github/workflows/build-full-idsk-site-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ochodnica-exhaustive-1to1-v4
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Crawl every public URL and build IDSK site
        shell: bash
        run: |
          cat > /tmp/build_v4.py <<'PY'
          import csv, hashlib, html, mimetypes, os, random, re, shutil, time
          from collections import deque
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urljoin, urlsplit, urlunsplit, unquote
          import xml.etree.ElementTree as ET
          import requests
          from bs4 import BeautifulSoup

          ROOT='https://www.ochodnica.sk/'
          HOSTS={'ochodnica.sk','www.ochodnica.sk'}
          OUT=Path('idsk-full-v4')
          ASSETS=OUT/'assets'/'migrated'
          DEADLINE=time.time()+45*60
          MAX_URLS=6000
          MAX_ASSETS=20000
          MIN_INTERVAL=.20
          JITTER=.18
          TRACKING={'fbclid','gclid','dclid','msclkid','utm_source','utm_medium','utm_campaign','utm_term','utm_content','_ga','_gl'}
          DOC={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.odt','.ods','.rtf','.csv','.zip','.rar','.7z','.asice','.xzep','.zep'}
          IMG={'.jpg','.jpeg','.png','.gif','.webp','.svg','.avif','.bmp','.tif','.tiff','.ico'}
          MEDIA={'.mp3','.wav','.ogg','.m4a','.aac','.mp4','.webm','.mov','.m4v','.avi','.mpeg','.mpg'}
          KNOWN_ASSET=DOC|IMG|MEDIA|{'.css','.js','.mjs','.woff','.woff2','.ttf','.otf','.eot','.xml','.json','.txt'}

          OUT.mkdir(exist_ok=True)
          ASSETS.mkdir(parents=True,exist_ok=True)
          if Path('assets/migrated').exists():
              shutil.copytree('assets/migrated',ASSETS,dirs_exist_ok=True)

          session=requests.Session()
          session.headers.update({'User-Agent':'NESS-Zilina-Ochodnica-1to1-migration/4.0','Accept-Language':'sk,en;q=0.8'})
          last_req=0.0; request_count=0
          queue=deque(); queued=set(); processed=set(); html_urls={}; aliases={}; binary_urls={}; asset_map={}
          errors=[]; unresolved=set(); content_mismatch=[]; NAV=[]; brand_logo=None

          def normalize_host_url(u):
              p=urlsplit(u)
              if p.netloc.lower().split(':')[0] not in HOSTS: return u
              q=[]
              for k,v in parse_qsl(p.query,keep_blank_values=True):
                  if k.lower() not in TRACKING: q.append((k,v))
              path=re.sub(r'/+','/',p.path or '/')
              return urlunsplit(('https','www.ochodnica.sk',path,urlencode(q),''))

          def canonical(raw,base=ROOT):
              if not raw or str(raw).startswith(('mailto:','tel:','javascript:','data:','blob:','#')): return None
              u=urljoin(base,str(raw).strip()); p=urlsplit(u)
              if p.scheme not in ('http','https') or p.netloc.lower().split(':')[0] not in HOSTS: return None
              return normalize_host_url(u)

          def throttle():
              global last_req
              wait=MIN_INTERVAL+random.uniform(0,JITTER)-(time.monotonic()-last_req)
              if wait>0: time.sleep(wait)
              last_req=time.monotonic()

          def request(url,purpose='page',stream=False):
              global request_count
              rate=0; trans=0
              while time.time()<DEADLINE:
                  throttle(); request_count+=1
                  try:
                      r=session.get(url,timeout=(10,55),allow_redirects=True,stream=stream)
                  except (requests.Timeout,requests.ConnectionError) as ex:
                      trans+=1
                      if trans>5:
                          unresolved.add(url); errors.append([url,purpose,'connection',repr(ex)]); return None
                      time.sleep(min(35,2**trans*2)+random.random()*2); continue
                  if r.status_code==429:
                      rate+=1; r.close()
                      if rate>7:
                          unresolved.add(url); errors.append([url,purpose,429,'retry exhausted']); return None
                      ra=r.headers.get('Retry-After')
                      try: delay=float(ra) if ra else min(90,4*(2**rate))
                      except: delay=min(90,4*(2**rate))
                      time.sleep(delay+random.uniform(.5,2)); continue
                  if r.status_code in (500,502,503,504):
                      trans+=1
                      code=r.status_code; r.close()
                      if trans>5:
                          unresolved.add(url); errors.append([url,purpose,code,'retry exhausted']); return None
                      time.sleep(min(40,2**trans*2)+random.random()*2); continue
                  return r
              unresolved.add(url); errors.append([url,purpose,'deadline','not fetched']); return None

          def enqueue(raw,base=ROOT):
              if len(queued)+len(processed)>=MAX_URLS: return
              u=canonical(raw,base)
              if not u or u in queued or u in processed: return
              queued.add(u); queue.append(u)

          def path_for(url):
              p=urlsplit(url); path=unquote(p.path).strip('/')
              if not path: dest=Path('index.html')
              else:
                  suff=Path(path).suffix.lower()
                  if suff in ('.html','.htm'): dest=Path(path)
                  elif suff and suff not in KNOWN_ASSET: dest=Path(path+'.html')
                  elif suff: dest=Path(path)
                  else: dest=Path(path)/'index.html'
              if p.query:
                  h=hashlib.sha1(p.query.encode()).hexdigest()[:12]
                  if dest.name=='index.html': dest=dest.parent/f'page--q-{h}.html'
                  else: dest=dest.with_name(dest.stem+f'--q-{h}'+dest.suffix)
              return dest

          def page_href(url):
              d=str(path_for(url)).replace('\\','/')
              if d=='index.html': d=''
              elif d.endswith('/index.html'): d=d[:-10]
              return '/ochodnica/'+d

          def asset_key(url): return normalize_host_url(url)

          # Reuse already downloaded v3 assets instead of hammering the original server again.
          if Path('MIGRATION-MANIFEST.csv').exists():
              try:
                  with open('MIGRATION-MANIFEST.csv',encoding='utf-8-sig',newline='') as f:
                      for row in csv.DictReader(f):
                          if row.get('type')=='asset' and row.get('source_url') and row.get('local_path'):
                              lp=Path(row['local_path'])
                              if (OUT/lp).exists(): asset_map[asset_key(row['source_url'])]='/ochodnica/'+str(lp).replace('\\','/')
              except Exception as ex: errors.append(['MIGRATION-MANIFEST.csv','manifest','read',repr(ex)])

          def safe_name(url,r):
              name=os.path.basename(unquote(urlsplit(url).path)) or 'file'
              cd=r.headers.get('Content-Disposition','')
              m=re.search(r'filename\*?=(?:UTF-8\x27\x27)?["\x27]?([^"\x27;]+)',cd,re.I)
              if m: name=unquote(m.group(1).strip())
              ctype=(r.headers.get('Content-Type') or '').split(';')[0].strip().lower()
              if not Path(name).suffix:
                  ext=mimetypes.guess_extension(ctype) or ''
                  if ext=='.jpe': ext='.jpg'
                  name+=ext
              name=re.sub(r'[^A-Za-z0-9._-]+','_',name)[:150] or 'file.bin'
              return hashlib.sha1(url.encode()).hexdigest()[:12]+'_'+name

          def asset_folder(url,r):
              ext=Path(urlsplit(url).path).suffix.lower(); ct=(r.headers.get('Content-Type') or '').lower()
              if ext in IMG or ct.startswith('image/'): return 'images'
              if ext in MEDIA or ct.startswith(('video/','audio/')): return 'media'
              if ext in DOC or any(x in ct for x in ('pdf','word','excel','spreadsheet','powerpoint','presentation','zip','rar','7z','rtf','csv','opendocument','pkcs7')): return 'documents'
              return 'misc'

          def store_binary(url,r):
              k=asset_key(url)
              if k in asset_map: r.close(); return asset_map[k]
              data=r.content
              folder=asset_folder(url,r); d=ASSETS/folder; d.mkdir(parents=True,exist_ok=True)
              dest=d/safe_name(k,r); dest.write_bytes(data)
              local='/ochodnica/'+str(dest.relative_to(OUT)).replace('\\','/')
              asset_map[k]=local; binary_urls[k]=local
              r.close(); return local

          def fetch_asset(raw,base=ROOT):
              u=canonical(raw,base)
              if not u: return None
              k=asset_key(u)
              if k in asset_map: return asset_map[k]
              if len(asset_map)>=MAX_ASSETS: unresolved.add(u); return None
              r=request(u,'asset')
              if r is None: return None
              if r.status_code>=400:
                  errors.append([u,'asset',r.status_code,'original response']); r.close(); return None
              ct=(r.headers.get('Content-Type') or '').lower()
              if 'text/html' in ct:
                  r.close(); enqueue(u); return page_href(u)
              return store_binary(u,r)

          def parse_sitemap(data,depth=0):
              if depth>4: return
              try: root=ET.fromstring(data)
              except Exception as ex: errors.append(['sitemap','parse','xml',repr(ex)]); return
              locs=[x.text.strip() for x in root.iter() if x.tag.lower().endswith('loc') and x.text]
              if root.tag.lower().endswith('sitemapindex'):
                  for loc in locs[:250]:
                      u=canonical(loc)
                      if not u: continue
                      r=request(u,'sitemap')
                      if r is not None and r.status_code==200: parse_sitemap(r.content,depth+1)
                      if r is not None: r.close()
              else:
                  for loc in locs: enqueue(loc)

          def seed():
              for u in [ROOT,ROOT+'sk/',ROOT+'sk/uradne-oznamy/',ROOT+'sk/kategoria/novinky-z-obce/',ROOT+'sk/o-obci/',ROOT+'sk/samosprava/',ROOT+'sk/obcan-a-podnikatel/',ROOT+'sk/galerie',ROOT+'galleries/index/lang:sk/page:1']:
                  enqueue(u)
              for sm in (ROOT+'sitemap.xml',ROOT+'sitemap_index.xml'):
                  r=request(sm,'sitemap')
                  if r is not None and r.status_code==200: parse_sitemap(r.content)
                  if r is not None: r.close()
              r=request(ROOT+'robots.txt','robots')
              if r is not None and r.status_code==200:
                  for line in r.text.splitlines():
                      if line.lower().startswith('sitemap:'):
                          sm=line.split(':',1)[1].strip(); rr=request(sm,'sitemap')
                          if rr is not None and rr.status_code==200: parse_sitemap(rr.content)
                          if rr is not None: rr.close()
              if r is not None: r.close()

          CSS='''
          :root{--b:#004d99;--d:#18324a;--n:#003b73;--t:#1b1f23;--m:#59636e;--l:#d8dde3;--s:#f3f5f7;--f:#ffdf0f}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--t);line-height:1.56}a{color:#005ea8;text-underline-offset:3px}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;background:var(--f);padding:12px;z-index:99}.top{background:var(--s);border-bottom:1px solid var(--l);font-size:14px}.top .wrap{padding:9px 0}.head{padding:24px 0}.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--t)}.brand img{width:68px;max-height:78px;object-fit:contain}.crest{width:58px;height:66px;background:var(--b);color:white;border-radius:12px 12px 20px 20px;display:grid;place-items:center;font-size:27px;font-weight:800}.brand strong{display:block;font-size:28px}.brand small{color:var(--m)}.nav{background:var(--n);border-bottom:4px solid #0070c9}.nav .wrap{display:flex;flex-wrap:wrap}.nav a{color:white;text-decoration:none;padding:15px 16px;font-weight:700}.nav a:hover{background:var(--b)}main{padding:42px 0 72px;min-height:560px}.crumb{font-size:14px;color:#67727e;margin-bottom:22px}.kicker{text-transform:uppercase;letter-spacing:.075em;font-size:13px;font-weight:800;color:var(--b)}h1{font-size:clamp(32px,5vw,50px);line-height:1.12;margin:8px 0 26px}.content{font-size:17px;overflow-wrap:anywhere}.content img,.content video,.content iframe{max-width:100%;height:auto}.content table{max-width:100%;border-collapse:collapse;display:block;overflow:auto}.content td,.content th{border:1px solid var(--l);padding:9px 11px}.footer{background:#202a34;color:#fff;padding:40px 0 20px}.footer a{color:#fff}.footgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:36px}.footbottom{border-top:1px solid #4a5661;margin-top:28px;padding-top:18px;color:#d5d9dd;font-size:14px}a:focus,button:focus,input:focus{outline:4px solid var(--f);outline-offset:2px}@media(max-width:820px){.nav .wrap{flex-direction:column}.brand strong{font-size:23px}.footgrid{grid-template-columns:1fr}}
          '''
          (OUT/'idsk.css').write_text(CSS,encoding='utf-8')
          (OUT/'.nojekyll').write_text('',encoding='utf-8')

          FALLBACK=[('Domov','/ochodnica/'),('Kontakt','/ochodnica/sk/kontakt.html'),('Obecný úrad','/ochodnica/sk/obecny-urad.html')]

          def discover_nav(soup,base):
              global NAV,brand_logo
              if not NAV:
                  best=[]
                  for node in soup.select('nav,.nav,.navigation,.menu,#menu,.main-menu,.navbar,header'):
                      items=[]; seen=set()
                      for a in node.select('a[href]'):
                          label=' '.join(a.stripped_strings); u=canonical(a.get('href'),base)
                          if not label or not u: continue
                          k=(label,u)
                          if k in seen: continue
                          seen.add(k); items.append((label[:45],page_href(u)))
                      if 4<=len(items)<=25 and len(items)>len(best): best=items
                  if best: NAV=best[:14]
              if not brand_logo:
                  for sel in ('header .logo img','header img.logo','.logo img','header img'):
                      x=soup.select_one(sel)
                      if x:
                          local=fetch_asset(x.get('src') or x.get('data-src'),base)
                          if local: brand_logo=local; break

          def title_for(soup):
              for sel in ('h1','.page-title','.article-title','.entry-title'):
                  x=soup.select_one(sel)
                  if x and x.get_text(' ',strip=True): return x.get_text(' ',strip=True)
              if soup.title:
                  t=soup.title.get_text(' ',strip=True)
                  return re.sub(r'\s*[|–-]\s*(Obec\s+)?Ochodnica.*$','',t,flags=re.I).strip() or 'Obec Ochodnica'
              return 'Obec Ochodnica'

          def main_node(soup):
              for sel in ('main','article','.page-content','.article-content','.entry-content','.content-main','#content-main','#content','.main-content','.content'):
                  candidates=[x for x in soup.select(sel) if len(x.get_text(' ',strip=True))>=20]
                  if candidates: return max(candidates,key=lambda x:len(x.get_text(' ',strip=True)))
              return soup.body or soup

          def norm_text(node): return re.sub(r'\s+',' ',node.get_text(' ',strip=True)).strip()

          def rewrite_node(node,base):
              src_text=norm_text(node)
              clone=BeautifulSoup(str(node),'html.parser')
              for x in clone.select('script,style,noscript'): x.decompose()
              for tag in clone.find_all(True):
                  if tag.name=='img':
                      raw=tag.get('src') or tag.get('data-src') or tag.get('data-original') or tag.get('data-lazy-src')
                      if raw:
                          loc=fetch_asset(raw,base)
                          if loc: tag['src']=loc
                      ss=tag.get('srcset') or tag.get('data-srcset')
                      if ss:
                          parts=[]
                          for part in ss.split(','):
                              bits=part.strip().split()
                              if bits:
                                  loc=fetch_asset(bits[0],base)
                                  if loc: parts.append(' '.join([loc]+bits[1:]))
                          if parts: tag['srcset']=', '.join(parts)
                      for a in ('data-src','data-original','data-lazy-src','data-srcset'): tag.attrs.pop(a,None)
                  elif tag.name in ('source','video','audio'):
                      for attr in ('src','poster'):
                          if tag.get(attr):
                              loc=fetch_asset(tag.get(attr),base)
                              if loc: tag[attr]=loc
                  elif tag.name=='a' and tag.get('href'):
                      raw=tag.get('href'); u=canonical(raw,base)
                      if not u: continue
                      ext=Path(urlsplit(u).path).suffix.lower()
                      if ext in KNOWN_ASSET:
                          loc=fetch_asset(u,base)
                          if loc: tag['href']=loc
                      else:
                          enqueue(u); tag['data-original-internal']=u; tag['href']=page_href(u)
              if norm_text(clone)!=src_text: content_mismatch.append(base)
              return str(clone)

          def shell(title,body):
              nav= NAV or FALLBACK
              navhtml=''.join(f'<a href="{html.escape(u,quote=True)}">{html.escape(t)}</a>' for t,u in nav)
              logo=f'<img src="{brand_logo}" alt="Erb obce Ochodnica">' if brand_logo else '<span class="crest">O</span>'
              return f'''<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{html.escape(title)} – Obec Ochodnica</title><link rel="stylesheet" href="/ochodnica/idsk.css"></head><body><a class="skip" href="#main">Preskočiť na obsah</a><div class="top"><div class="wrap">Obec Ochodnica</div></div><header class="head"><div class="wrap"><a class="brand" href="/ochodnica/">{logo}<span><strong>Obec Ochodnica</strong><small>webové sídlo obce</small></span></a></div></header><nav class="nav"><div class="wrap">{navhtml}</div></nav><main id="main"><div class="wrap"><div class="crumb"><a href="/ochodnica/">Domov</a> › {html.escape(title)}</div><span class="kicker">Obec Ochodnica</span><h1>{html.escape(title)}</h1><div class="content source-content">{body}</div></div></main><footer class="footer"><div class="wrap"><div class="footgrid"><div><strong>Obec Ochodnica</strong><span>Ochodnica 121, 023 35 Ochodnica</span><a href="mailto:obec@ochodnica.sk">obec@ochodnica.sk</a></div><div><strong>Technické riešenie a realizácia</strong><span>NESS Žilina</span></div></div><div class="footbottom">Obsah migrovaný z pôvodného verejného webového sídla obce Ochodnica.</div></div></footer></body></html>'''

          def write_alias(src,final):
              if src==final: return
              d=OUT/path_for(src); d.parent.mkdir(parents=True,exist_ok=True)
              target=page_href(final)
              d.write_text(f'<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url={html.escape(target,quote=True)}"><link rel="canonical" href="{html.escape(target,quote=True)}"></head><body><a href="{html.escape(target,quote=True)}">Pokračovať</a></body></html>',encoding='utf-8')
              aliases[src]=d

          def process(url):
              r=request(url,'page')
              if r is None: return
              if r.status_code>=400:
                  errors.append([url,'page',r.status_code,'original response']); r.close(); return
              final=canonical(r.url) or url
              ct=(r.headers.get('Content-Type') or '').lower()
              raw=r.content
              is_html='text/html' in ct or b'<html' in raw[:4000].lower() or b'<!doctype html' in raw[:4000].lower()
              if not is_html:
                  store_binary(url,r); return
              try: text=r.text
              except: text=raw.decode('utf-8','replace')
              r.close()
              soup=BeautifulSoup(text,'html.parser')
              discover_nav(soup,final)
              for a in soup.find_all('a',href=True): enqueue(a['href'],final)
              title=title_for(soup); node=main_node(soup); body=rewrite_node(node,final)
              d=OUT/path_for(final); d.parent.mkdir(parents=True,exist_ok=True); d.write_text(shell(title,body),encoding='utf-8')
              html_urls[final]=d
              write_alias(url,final)

          seed()
          while queue and len(processed)<MAX_URLS and time.time()<DEADLINE:
              u=queue.popleft(); queued.discard(u)
              if u in processed: continue
              processed.add(u); process(u)
              if len(processed)%200==0: print(f'processed={len(processed)} queue={len(queue)} html={len(html_urls)} assets={len(asset_map)}',flush=True)

          # Rewrite links after every target has been classified as HTML or binary.
          for p in OUT.rglob('*.html'):
              soup=BeautifulSoup(p.read_text('utf-8',errors='ignore'),'html.parser'); changed=False
              for a in soup.select('a[data-original-internal]'):
                  u=a.get('data-original-internal'); k=asset_key(u)
                  if k in asset_map: a['href']=asset_map[k]
                  elif u in html_urls or u in aliases: a['href']=page_href(u)
                  else: a['href']=u
                  del a['data-original-internal']; changed=True
              if changed: p.write_text(str(soup),encoding='utf-8')

          # Hard validation.
          broken=[]
          for p in OUT.rglob('*.html'):
              soup=BeautifulSoup(p.read_text('utf-8',errors='ignore'),'html.parser')
              for tag in soup.find_all(['a','img','source','video','audio','link']):
                  v=tag.get('href') or tag.get('src')
                  if not v or not v.startswith('/ochodnica/'): continue
                  rel=v[len('/ochodnica/'):].split('#',1)[0].split('?',1)[0]
                  target=OUT/rel
                  if not rel: target=OUT/'index.html'
                  elif v.split('?',1)[0].endswith('/') or not Path(rel).suffix: target=target/'index.html'
                  if not target.exists(): broken.append([str(p.relative_to(OUT)),v])

          critical=OUT/'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html'
          summary=[
            'Ochodnica – exhaustive 1:1 migration',
            f'URLs processed: {len(processed)}',
            f'HTML pages fetched/generated: {len(html_urls)}',
            f'Redirect aliases generated: {len(aliases)}',
            f'Assets available locally: {len(asset_map)}',
            f'HTTP requests: {request_count}',
            f'Unresolved transient/429: {len(unresolved)}',
            f'Content text mismatches: {len(content_mismatch)}',
            f'Broken local references: {len(broken)}',
            f'Crawler warnings/errors: {len(errors)}',
            f'Critical official notice present: {critical.exists()}',
            'Branding: NESS Žilina'
          ]
          (OUT/'MIGRATION-SUMMARY-V4.txt').write_text('\n'.join(summary)+'\n',encoding='utf-8')
          with (OUT/'MIGRATION-ERRORS-V4.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['url','type','status','detail']); w.writerows(errors)
          with (OUT/'BROKEN-LOCAL-V4.csv').open('w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f); w.writerow(['page','target']); w.writerows(broken)
          print('\n'.join(summary),flush=True)

          if unresolved: raise SystemExit(f'FAIL: unresolved transient URLs: {len(unresolved)}')
          if content_mismatch: raise SystemExit(f'FAIL: source content text changed on {len(content_mismatch)} pages')
          if broken: raise SystemExit(f'FAIL: broken local references: {len(broken)}')
          if not critical.exists(): raise SystemExit('FAIL: critical notice missing')
          if len(html_urls)<900: raise SystemExit(f'FAIL: only {len(html_urls)} HTML pages generated; exhaustive crawl expected >=900')
          PY
          python /tmp/build_v4.py

      - name: Save validated exhaustive site into repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a idsk-full-v4/ ./
          git config user.name "NESS Zilina migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html idsk.css .nojekyll sk galleries assets MIGRATION-SUMMARY-V4.txt MIGRATION-ERRORS-V4.csv BROKEN-LOCAL-V4.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Publish exhaustive 1:1 Ochodnica content in IDSK layout"
            git push origin HEAD:main
          fi

      - name: Prepare Pages
        uses: actions/configure-pages@v5

      - name: Upload validated site
        uses: actions/upload-pages-artifact@v3
        with:
          path: idsk-full-v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated 1:1 site
        id: deployment
        uses: actions/deploy-pages@v4
