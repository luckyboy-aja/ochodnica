name: Build full Ochodnica IDSK site

on:
  push:
    paths:
      - '.github/workflows/build-full-idsk-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ochodnica-full-idsk-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout IDSK demo
        uses: actions/checkout@v4

      - name: Install crawler dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Crawl original site and build IDSK version
        shell: bash
        run: |
          cat > /tmp/build_idsk.py <<'PY'
          import os,re,time,hashlib,csv
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit,urlunsplit,unquote
          import requests
          from bs4 import BeautifulSoup

          ROOT='https://www.ochodnica.sk/'
          HOSTS={'ochodnica.sk','www.ochodnica.sk'}
          OUT=Path('idsk-full')
          ASSETS=OUT/'assets'
          for p in [OUT,ASSETS/'images',ASSETS/'documents',ASSETS/'media',ASSETS/'styles',ASSETS/'scripts']:
              p.mkdir(parents=True,exist_ok=True)

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Ochodnica IDSK migration crawler/1.0'})
          MAX_PAGES=2500
          MAX_ASSETS=12000
          DEADLINE=time.time()+20*60
          q=deque([ROOT])
          seen=set()
          queued={ROOT}
          asset_seen=set()
          external_videos=set()
          manifest=[]
          errors=[]

          DOC={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.odt','.ods','.rtf','.csv','.zip','.rar','.7z'}
          IMG={'.jpg','.jpeg','.png','.gif','.webp','.svg','.avif','.bmp','.tif','.tiff'}
          MEDIA={'.mp3','.wav','.ogg','.m4a','.mp4','.webm','.mov','.m4v','.avi','.mpeg','.mpg'}
          STYLE={'.css','.woff','.woff2','.ttf','.otf','.eot'}
          SCRIPT={'.js','.mjs','.json'}
          ASSET_EXT=DOC|IMG|MEDIA|STYLE|SCRIPT|{'.ico','.xml','.txt'}

          def canon(raw,base=ROOT):
              if not raw or raw.startswith(('mailto:','tel:','javascript:','data:','blob:','#')): return None
              u=urljoin(base,raw)
              p=urlsplit(u)
              host=p.netloc.lower().split(':')[0]
              if host not in HOSTS:
                  if any(x in host for x in ('youtube.com','youtu.be','vimeo.com')): external_videos.add(u)
                  return None
              path=re.sub(r'/+','/',p.path or '/')
              return urlunsplit(('https','www.ochodnica.sk',path,'',''))

          def ext(u): return Path(urlsplit(u).path).suffix.lower()
          def is_asset(u): return ext(u) in ASSET_EXT

          def slug_path(url):
              path=unquote(urlsplit(url).path).strip('/')
              if not path: return Path('index.html')
              e=Path(path).suffix.lower()
              if e in {'.html','.htm'}:
                  return Path(path)
              if e in {'.php','.asp','.aspx'}:
                  return Path(path+'.html')
              if e:
                  return Path(path)
              return Path(path)/'index.html'

          def page_href(url):
              p=slug_path(url)
              return '/ochodnica/'+str(p).replace('index.html','').replace('\\','/')

          def asset_folder(e):
              if e in IMG: return ASSETS/'images'
              if e in DOC: return ASSETS/'documents'
              if e in MEDIA: return ASSETS/'media'
              if e in STYLE: return ASSETS/'styles'
              if e in SCRIPT: return ASSETS/'scripts'
              return ASSETS/'misc'

          def save_asset(url):
              if url in asset_seen or len(asset_seen)>=MAX_ASSETS or time.time()>DEADLINE: return None
              asset_seen.add(url)
              try:
                  r=session.get(url,timeout=(8,25),allow_redirects=True)
                  if r.status_code>=400: errors.append([url,'asset',r.status_code]); return None
                  e=ext(r.url)
                  folder=asset_folder(e); folder.mkdir(parents=True,exist_ok=True)
                  name=os.path.basename(unquote(urlsplit(r.url).path)) or hashlib.md5(url.encode()).hexdigest()
                  name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
                  if not name: name=hashlib.md5(url.encode()).hexdigest()
                  p=folder/name
                  if p.exists():
                      stem,suf=os.path.splitext(name); p=folder/f'{stem}_{hashlib.md5(url.encode()).hexdigest()[:8]}{suf}'
                  p.write_bytes(r.content)
                  manifest.append(['asset',url,str(p),len(r.content)])
                  return '../' * 0 + '/' + str(p).replace('\\','/')
              except Exception as ex:
                  errors.append([url,'asset',str(ex)]); return None

          def best_main(soup):
              # Remove obvious chrome first.
              for sel in ['script','style','noscript','nav','footer','header','.cookie','.cookies','.sidebar','.breadcrumb','.breadcrumbs']:
                  for x in soup.select(sel): x.decompose()
              for sel in ['main','article','.content','.page-content','#content','.main-content','.container-content']:
                  x=soup.select_one(sel)
                  if x and len(x.get_text(' ',strip=True))>100: return x
              body=soup.body or soup
              return body

          def title_for(soup,url):
              for sel in ['h1','.page-title','.article-title']:
                  x=soup.select_one(sel)
                  if x and x.get_text(strip=True): return x.get_text(' ',strip=True)
              if soup.title and soup.title.get_text(strip=True):
                  t=soup.title.get_text(' ',strip=True)
                  t=re.sub(r'\s*[|–-]\s*Ochodnica.*$','',t,flags=re.I)
                  return t
              return 'Obec Ochodnica'

          def rewrite_content(node,base):
              # Download images/documents/media and rewrite internal page links.
              for tag in node.find_all(True):
                  if tag.name=='img':
                      src=tag.get('src') or tag.get('data-src')
                      u=canon(src,base) if src else None
                      if u:
                          local=save_asset(u)
                          if local: tag['src']=local
                      for a in ['srcset','data-src','data-original','loading']:
                          if a!='loading': tag.attrs.pop(a,None)
                  if tag.name in ('video','source') and tag.get('src'):
                      u=canon(tag.get('src'),base)
                      if u:
                          local=save_asset(u)
                          if local: tag['src']=local
                  if tag.name=='a' and tag.get('href'):
                      href=tag['href']
                      u=canon(href,base)
                      if not u: continue
                      if is_asset(u):
                          local=save_asset(u)
                          if local: tag['href']=local
                      else:
                          tag['href']=page_href(u)
              return str(node)

          CSS='''
          :root{--blue:#0065b3;--nav:#003366;--text:#1f242b;--muted:#5b6570;--line:#d7dde2;--bg:#f4f6f8;--focus:#ffdf0f}
          *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);line-height:1.55;background:#fff}a{color:#005ea8;text-underline-offset:2px}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.demo{background:#fff4ce;border-bottom:1px solid #e5bd69;padding:10px max(16px,calc((100% - 1180px)/2));font-size:14px}.demo b{background:#8a5600;color:#fff;padding:3px 8px;border-radius:4px;margin-right:10px}.gov{background:#f4f6f8;border-bottom:1px solid var(--line);font-size:14px}.gov .wrap{padding:10px 0}.head{padding:26px 0}.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text)}.crest{width:58px;height:66px;border-radius:14px 14px 20px 20px;background:#0b4ea2;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800}.brand strong{font-size:27px;display:block}.brand small{color:var(--muted)}.nav{background:var(--nav)}.nav .wrap{display:flex;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:15px 16px;font-weight:700}.nav a:hover{background:var(--blue)}main{padding:44px 0 70px;min-height:560px}.crumb{font-size:14px;color:#68727d;margin-bottom:24px}.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:800;color:var(--blue)}h1{font-size:clamp(34px,5vw,52px);line-height:1.1;margin:8px 0 24px}h2{font-size:28px;margin-top:34px}h3{font-size:22px}.content{font-size:17px}.content img{max-width:100%;height:auto;border-radius:6px}.content table{width:100%;border-collapse:collapse;display:block;overflow:auto}.content th,.content td{border:1px solid var(--line);padding:9px 11px}.content blockquote{border-left:5px solid var(--blue);padding:10px 18px;background:#f4f6f8;margin-left:0}.content a[href$=".pdf"],.content a[href*="/assets/documents/"]{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-left:4px solid var(--blue);margin:4px 0;text-decoration:none}.footer{background:#1f242b;color:#fff;padding:42px 0 22px}.footer a{color:#fff}.footgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}.footgrid>div{display:flex;flex-direction:column;gap:7px}.footbottom{border-top:1px solid #50565c;margin-top:28px;padding-top:18px;color:#cbd0d4;font-size:14px}a:focus,button:focus,input:focus{outline:4px solid var(--focus);outline-offset:2px}@media(max-width:800px){.nav .wrap{flex-direction:column}.brand strong{font-size:22px}.footgrid{grid-template-columns:1fr}}
          '''
          (OUT/'idsk.css').write_text(CSS,encoding='utf-8')

          NAV=[('Domov','/ochodnica/'),('Obec','/ochodnica/sk/o-obci/'),('Samospráva','/ochodnica/sk/samosprava/'),('Aktuality','/ochodnica/sk/kategoria/novinky-z-obce/'),('Úradná tabuľa','/ochodnica/sk/uradna-tabula/'),('Ako vybaviť','/ochodnica/sk/obcan-a-podnikatel/'),('Kontakt','/ochodnica/sk/obecny-urad.html')]

          def shell(title,content,source_url):
              nav=''.join(f'<a href="{u}">{t}</a>' for t,u in NAV)
              return f'''<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} – Obec Ochodnica</title><link rel="stylesheet" href="/ochodnica/idsk.css"></head><body>
              <div class="demo"><b>DEMO UKÁŽKA</b>Nejde o oficiálne webové sídlo obce Ochodnica.</div>
              <div class="gov"><div class="wrap">🇸🇰 Oficiálna stránka verejnej správy SR</div></div>
              <header class="head"><div class="wrap"><a class="brand" href="/ochodnica/"><span class="crest">O</span><span><strong>Obec Ochodnica</strong><small>webové sídlo obce</small></span></a></div></header>
              <nav class="nav"><div class="wrap">{nav}</div></nav>
              <main><div class="wrap"><div class="crumb"><a href="/ochodnica/">Domov</a> › {title}</div><span class="kicker">Obec Ochodnica</span><h1>{title}</h1><div class="content">{content}</div></div></main>
              <footer class="footer"><div class="wrap footgrid"><div><strong>Obec Ochodnica</strong><span>Ochodnica 121, 023 35 Ochodnica</span><a href="mailto:obec@ochodnica.sk">obec@ochodnica.sk</a><a href="tel:+421414233121">041 / 423 31 21</a></div><div><strong>Rýchle odkazy</strong><a href="/ochodnica/sk/uradna-tabula/">Úradná tabuľa</a><a href="/ochodnica/sk/obcan-a-podnikatel/">Ako vybaviť</a></div><div><strong>Informácie</strong><span>Demo migrácie do IDSK 3</span><span>Zdroj obsahu: ochodnica.sk</span></div></div><div class="wrap footbottom">Neoficiálna ukážka · IDSK 3</div></footer>
              </body></html>'''

          while q and len(seen)<MAX_PAGES and time.time()<DEADLINE:
              url=q.popleft(); queued.discard(url)
              if url in seen: continue
              seen.add(url)
              try:
                  r=session.get(url,timeout=(8,25),allow_redirects=True)
                  if r.status_code>=400: errors.append([url,'page',r.status_code]); continue
                  ctype=(r.headers.get('content-type') or '').lower()
                  if 'text/html' not in ctype: save_asset(url); continue
                  soup=BeautifulSoup(r.text,'html.parser')
                  # Discover all local links before stripping chrome.
                  for a in soup.find_all('a',href=True):
                      u=canon(a['href'],r.url)
                      if not u: continue
                      if is_asset(u): save_asset(u)
                      elif u not in seen and u not in queued and len(seen)+len(queued)<MAX_PAGES:
                          queued.add(u); q.append(u)
                  for tag in soup.find_all(['img','script','link','video','source']):
                      raw=tag.get('src') or tag.get('href')
                      u=canon(raw,r.url) if raw else None
                      if u and is_asset(u): save_asset(u)
                  title=title_for(soup,r.url)
                  main=best_main(soup)
                  content=rewrite_content(main,r.url)
                  dest=OUT/slug_path(canon(r.url) or url)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_text(shell(title,content,r.url),encoding='utf-8')
                  manifest.append(['page',url,str(dest),len(content.encode('utf-8'))])
                  if len(seen)%100==0: print('pages',len(seen),'queue',len(q),'assets',len(asset_seen),flush=True)
              except Exception as ex:
                  errors.append([url,'page',str(ex)])

          with open(OUT/'MIGRATION-MANIFEST.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['type','source_url','local_path','bytes']); w.writerows(manifest)
          with open(OUT/'MIGRATION-ERRORS.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['url','type','detail']); w.writerows(errors)
          (OUT/'EXTERNAL-VIDEO-LINKS.txt').write_text('\n'.join(sorted(external_videos)),encoding='utf-8')
          (OUT/'MIGRATION-SUMMARY.txt').write_text(f'''Ochodnica -> IDSK 3 migration build\nPages migrated: {len(seen)}\nAssets downloaded: {len(asset_seen)}\nManifest entries: {len(manifest)}\nExternal video links: {len(external_videos)}\nErrors/non-200: {len(errors)}\n''',encoding='utf-8')
          print((OUT/'MIGRATION-SUMMARY.txt').read_text(),flush=True)
          PY
          python /tmp/build_idsk.py

      - name: Show generated site summary
        run: |
          du -sh idsk-full
          find idsk-full -type f | wc -l
          cat idsk-full/MIGRATION-SUMMARY.txt

      - name: Upload complete migrated IDSK site
        uses: actions/upload-artifact@v4
        with:
          name: ochodnica-full-idsk-site
          path: idsk-full
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
