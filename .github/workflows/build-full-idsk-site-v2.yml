name: Build and publish full Ochodnica IDSK site

on:
  push:
    paths:
      - '.github/workflows/build-full-idsk-site-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ochodnica-full-idsk-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Crawl original site and generate IDSK pages
        shell: bash
        run: |
          cat > /tmp/build.py <<'PY'
          import csv, hashlib, os, re, time
          from collections import deque
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urljoin, urlsplit, urlunsplit, unquote
          import xml.etree.ElementTree as ET
          import requests
          from bs4 import BeautifulSoup

          ROOT='https://www.ochodnica.sk/'
          HOSTS={'ochodnica.sk','www.ochodnica.sk'}
          OUT=Path('idsk-full')
          ASSETS=OUT/'assets'/'migrated'
          OUT.mkdir(parents=True,exist_ok=True)
          ASSETS.mkdir(parents=True,exist_ok=True)

          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 Ochodnica IDSK migration crawler/2.0'})

          MAX_PAGES=4000
          MAX_ASSETS=15000
          MAX_ASSET_BYTES=90*1024*1024
          MAX_TOTAL_BYTES=900*1024*1024
          DEADLINE=time.time()+22*60

          TRACKING={'fbclid','gclid','utm_source','utm_medium','utm_campaign','utm_term','utm_content'}
          PAGING_KEYS={'page','p','strana','start','offset','limit','rok','year','cat','category'}
          DOC={'.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.odt','.ods','.rtf','.csv','.zip','.rar','.7z'}
          IMG={'.jpg','.jpeg','.png','.gif','.webp','.svg','.avif','.bmp','.tif','.tiff'}
          MEDIA={'.mp3','.wav','.ogg','.m4a','.aac','.mp4','.webm','.mov','.m4v','.avi','.mpeg','.mpg'}
          ASSET_EXT=DOC|IMG|MEDIA|{'.ico'}

          MANDATORY=[
            ROOT,
            ROOT+'sk/uradne-oznamy/',
            ROOT+'sk/uradne-oznamy/2026/',
            ROOT+'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html',
            ROOT+'sk/kategoria/novinky-z-obce/',
            ROOT+'sk/obecny-urad.html',
            ROOT+'sk/o-obci/',
            ROOT+'sk/samosprava/',
            ROOT+'sk/obcan-a-podnikatel/'
          ]

          q=deque()
          queued=set(); seen=set(); asset_seen=set(); manifest=[]; errors=[]; external_videos=set()
          total_asset_bytes=0

          def canonical(raw,base=ROOT,keep_query=True):
              if not raw or raw.startswith(('mailto:','tel:','javascript:','data:','blob:','#')): return None
              u=urljoin(base,raw)
              p=urlsplit(u)
              host=p.netloc.lower().split(':')[0]
              if host not in HOSTS:
                  if any(x in host for x in ('youtube.com','youtu.be','vimeo.com')): external_videos.add(u)
                  return None
              path=re.sub(r'/+','/',p.path or '/')
              query=''
              if keep_query and p.query:
                  kept=[]
                  for k,v in parse_qsl(p.query,keep_blank_values=False):
                      lk=k.lower()
                      if lk in TRACKING: continue
                      if lk in PAGING_KEYS:
                          if len(v)<=40 and not re.search(r'[^A-Za-z0-9._-]',v): kept.append((k,v))
                  if kept: query=urlencode(sorted(kept))
              return urlunsplit(('https','www.ochodnica.sk',path,query,''))

          def output_url(u):
              p=urlsplit(u)
              return urlunsplit(('https','www.ochodnica.sk',p.path,'',''))

          def ext(u): return Path(urlsplit(u).path).suffix.lower()
          def is_asset(u): return ext(u) in ASSET_EXT

          def enqueue(u):
              c=canonical(u)
              if not c or c in queued or c in seen or is_asset(c): return
              if len(queued)+len(seen)>=MAX_PAGES: return
              queued.add(c); q.append(c)

          for u in MANDATORY: enqueue(u)

          def slug_path(u):
              path=unquote(urlsplit(output_url(u)).path).strip('/')
              if not path: return Path('index.html')
              e=Path(path).suffix.lower()
              if e in {'.html','.htm'}: return Path(path)
              if e in {'.php','.asp','.aspx'}: return Path(path+'.html')
              if e: return Path(path)
              return Path(path)/'index.html'

          def page_href(u):
              p=slug_path(output_url(u))
              s=str(p).replace('\\','/')
              if s.endswith('index.html'): s=s[:-10]
              return '/ochodnica/'+s

          def safe_name(u):
              path=unquote(urlsplit(u).path)
              name=os.path.basename(path) or hashlib.sha1(u.encode()).hexdigest()
              name=re.sub(r'[^A-Za-z0-9._-]+','_',name)
              return hashlib.sha1(u.encode()).hexdigest()[:10]+'_'+name[:130]

          def save_asset(u):
              nonlocal_dummy=None
              global total_asset_bytes
              c=canonical(u,keep_query=False)
              if not c or c in asset_seen or len(asset_seen)>=MAX_ASSETS or time.time()>DEADLINE: return None
              asset_seen.add(c)
              try:
                  r=session.get(c,timeout=(8,30),allow_redirects=True)
                  if r.status_code>=400:
                      errors.append([c,'asset',r.status_code]); return None
                  size=len(r.content)
                  if size>MAX_ASSET_BYTES or total_asset_bytes+size>MAX_TOTAL_BYTES:
                      errors.append([c,'asset','size-limit']); return None
                  e=ext(r.url)
                  folder='images' if e in IMG else 'documents' if e in DOC else 'media' if e in MEDIA else 'misc'
                  d=ASSETS/folder; d.mkdir(parents=True,exist_ok=True)
                  p=d/safe_name(r.url)
                  p.write_bytes(r.content)
                  total_asset_bytes+=size
                  manifest.append(['asset',c,str(p.relative_to(OUT)),size])
                  return '/ochodnica/'+str(p.relative_to(OUT)).replace('\\','/')
              except Exception as ex:
                  errors.append([c,'asset',str(ex)]); return None

          def seed_sitemaps():
              for url in [ROOT+'sitemap.xml',ROOT+'sitemap_index.xml']:
                  try:
                      r=session.get(url,timeout=(8,20))
                      if r.status_code==200: parse_sitemap(r.content,0)
                  except Exception as ex: errors.append([url,'sitemap',str(ex)])
              try:
                  r=session.get(ROOT+'robots.txt',timeout=(8,20))
                  if r.status_code==200:
                      for line in r.text.splitlines():
                          if line.lower().startswith('sitemap:'):
                              su=line.split(':',1)[1].strip()
                              rr=session.get(su,timeout=(8,20))
                              if rr.status_code==200: parse_sitemap(rr.content,0)
              except Exception as ex: errors.append([ROOT+'robots.txt','robots',str(ex)])

          def parse_sitemap(data,depth):
              if depth>3: return
              try:
                  root=ET.fromstring(data)
                  locs=[x.text.strip() for x in root.iter() if x.tag.lower().endswith('loc') and x.text]
                  if root.tag.lower().endswith('sitemapindex'):
                      for loc in locs[:100]:
                          try:
                              r=session.get(loc,timeout=(8,20))
                              if r.status_code==200: parse_sitemap(r.content,depth+1)
                          except Exception: pass
                  else:
                      for loc in locs: enqueue(loc)
              except Exception: pass

          seed_sitemaps()

          CSS='''
          :root{--blue:#0065b3;--nav:#003366;--text:#1f242b;--muted:#59636e;--line:#d7dde2;--soft:#f4f6f8;--focus:#ffdf0f}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);line-height:1.55;background:#fff}a{color:#005ea8;text-underline-offset:2px}.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;background:var(--focus);color:#111;padding:12px;z-index:999}.demo{background:#fff4ce;border-bottom:1px solid #e5bd69;padding:10px max(16px,calc((100% - 1180px)/2));font-size:14px}.demo b{background:#8a5600;color:#fff;padding:3px 8px;border-radius:4px;margin-right:10px}.gov{background:var(--soft);border-bottom:1px solid var(--line);font-size:14px}.gov .wrap{padding:10px 0}.head{padding:25px 0}.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text)}.crest{width:58px;height:66px;border-radius:14px 14px 20px 20px;background:#0b4ea2;color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800}.brand strong{display:block;font-size:27px}.brand small{display:block;color:var(--muted)}.nav{background:var(--nav)}.nav .wrap{display:flex;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:15px 16px;font-weight:700}.nav a:hover{background:var(--blue)}main{padding:44px 0 72px;min-height:560px}.crumb{font-size:14px;color:#68727d;margin-bottom:24px}.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:13px;font-weight:800;color:var(--blue)}h1{font-size:clamp(34px,5vw,52px);line-height:1.1;margin:8px 0 25px}h2{font-size:28px;margin-top:34px}h3{font-size:22px}.content{font-size:17px}.content img{max-width:100%;height:auto;border-radius:6px}.content table{width:100%;border-collapse:collapse;display:block;overflow:auto}.content td,.content th{border:1px solid var(--line);padding:9px 11px}.content blockquote{border-left:5px solid var(--blue);padding:10px 18px;background:var(--soft);margin-left:0}.content a[href*="/assets/migrated/documents/"]{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--blue);margin:4px 0;text-decoration:none}.footer{background:#1f242b;color:#fff;padding:42px 0 22px}.footer a{color:#fff}.footgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}.footgrid>div{display:flex;flex-direction:column;gap:7px}.footbottom{border-top:1px solid #50565c;margin-top:28px;padding-top:18px;color:#cbd0d4;font-size:14px}a:focus,button:focus,input:focus{outline:4px solid var(--focus);outline-offset:2px}@media(max-width:800px){.nav .wrap{flex-direction:column}.brand strong{font-size:22px}.footgrid{grid-template-columns:1fr}}
          '''
          (OUT/'idsk.css').write_text(CSS,encoding='utf-8')

          NAV=[('Domov','/ochodnica/'),('Obec','/ochodnica/sk/o-obci/'),('Samospráva','/ochodnica/sk/samosprava/'),('Aktuality','/ochodnica/sk/kategoria/novinky-z-obce/'),('Úradné oznamy','/ochodnica/sk/uradne-oznamy/'),('Ako vybaviť','/ochodnica/sk/obcan-a-podnikatel/'),('Kontakt','/ochodnica/sk/obecny-urad.html')]

          def title_for(soup):
              for sel in ['h1','.page-title','.article-title']:
                  x=soup.select_one(sel)
                  if x and x.get_text(strip=True): return x.get_text(' ',strip=True)
              if soup.title:
                  t=soup.title.get_text(' ',strip=True)
                  return re.sub(r'\s*[|–-]\s*(Obec\s+)?Ochodnica.*$','',t,flags=re.I).strip() or 'Obec Ochodnica'
              return 'Obec Ochodnica'

          def main_node(soup):
              for sel in ['main','article','.page-content','.article-content','.content','#content','.main-content']:
                  x=soup.select_one(sel)
                  if x and len(x.get_text(' ',strip=True))>40: return x
              return soup.body or soup

          def clean_and_rewrite(node,base):
              for x in node.select('script,style,noscript,nav,footer,header,.cookie,.cookies,.breadcrumb,.breadcrumbs'):
                  x.decompose()
              for tag in node.find_all(True):
                  if tag.name=='img':
                      raw=tag.get('src') or tag.get('data-src') or tag.get('data-original')
                      u=canonical(raw,base,keep_query=False) if raw else None
                      if u:
                          local=save_asset(u)
                          if local: tag['src']=local
                      for a in ('srcset','data-srcset','data-src','data-original'): tag.attrs.pop(a,None)
                  elif tag.name in ('video','source') and tag.get('src'):
                      u=canonical(tag.get('src'),base,keep_query=False)
                      if u:
                          local=save_asset(u)
                          if local: tag['src']=local
                  elif tag.name=='a' and tag.get('href'):
                      href=tag['href']; u=canonical(href,base,keep_query=True)
                      if not u: continue
                      if is_asset(u):
                          local=save_asset(u)
                          if local: tag['href']=local
                      else:
                          tag['href']=page_href(u)
              return str(node)

          def shell(title,content):
              nav=''.join(f'<a href="{u}">{t}</a>' for t,u in NAV)
              return f'''<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} – Obec Ochodnica</title><link rel="stylesheet" href="/ochodnica/idsk.css"></head><body><a class="skip" href="#main">Preskočiť na obsah</a><div class="demo"><b>DEMO UKÁŽKA</b>Nejde o oficiálne webové sídlo obce Ochodnica.</div><div class="gov"><div class="wrap">🇸🇰 Oficiálna stránka verejnej správy SR</div></div><header class="head"><div class="wrap"><a class="brand" href="/ochodnica/"><span class="crest">O</span><span><strong>Obec Ochodnica</strong><small>webové sídlo obce</small></span></a></div></header><nav class="nav"><div class="wrap">{nav}</div></nav><main id="main"><div class="wrap"><div class="crumb"><a href="/ochodnica/">Domov</a> › {title}</div><span class="kicker">Obec Ochodnica</span><h1>{title}</h1><div class="content">{content}</div></div></main><footer class="footer"><div class="wrap footgrid"><div><strong>Obec Ochodnica</strong><span>Ochodnica 121, 023 35 Ochodnica</span><a href="mailto:obec@ochodnica.sk">obec@ochodnica.sk</a><a href="tel:+421414233121">041 / 423 31 21</a></div><div><strong>Rýchle odkazy</strong><a href="/ochodnica/sk/uradne-oznamy/">Úradné oznamy</a><a href="/ochodnica/sk/obcan-a-podnikatel/">Ako vybaviť</a></div><div><strong>Informácie</strong><span>Demo migrácie do IDSK 3</span><span>Zdroj obsahu: ochodnica.sk</span></div></div><div class="wrap footbottom">Neoficiálna ukážka · IDSK 3</div></footer></body></html>'''

          while q and len(seen)<MAX_PAGES and time.time()<DEADLINE:
              url=q.popleft(); queued.discard(url)
              if url in seen: continue
              seen.add(url)
              try:
                  r=session.get(url,timeout=(8,30),allow_redirects=True)
                  if r.status_code>=400:
                      errors.append([url,'page',r.status_code]); continue
                  ctype=(r.headers.get('content-type') or '').lower()
                  if 'text/html' not in ctype:
                      save_asset(url); continue
                  soup=BeautifulSoup(r.text,'html.parser')
                  for a in soup.find_all('a',href=True):
                      u=canonical(a['href'],r.url,keep_query=True)
                      if not u: continue
                      if is_asset(u): save_asset(u)
                      else: enqueue(u)
                  for tag in soup.find_all(['img','video','source']):
                      raw=tag.get('src') or tag.get('data-src') or tag.get('data-original')
                      if raw:
                          u=canonical(raw,r.url,keep_query=False)
                          if u and is_asset(u): save_asset(u)
                  title=title_for(soup)
                  node=main_node(soup)
                  content=clean_and_rewrite(node,r.url)
                  dest=OUT/slug_path(output_url(url))
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_text(shell(title,content),encoding='utf-8')
                  manifest.append(['page',url,str(dest.relative_to(OUT)),len(content.encode('utf-8'))])
                  if len(seen)%100==0: print(f'pages={len(seen)} queue={len(q)} assets={len(asset_seen)}',flush=True)
              except Exception as ex:
                  errors.append([url,'page',str(ex)])

          # Critical page must exist even if navigation/sitemap discovery changes.
          critical=OUT/'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html'
          if not critical.exists():
              url=ROOT+'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html'
              try:
                  r=session.get(url,timeout=(8,30))
                  if r.status_code==200:
                      soup=BeautifulSoup(r.text,'html.parser'); title=title_for(soup); node=main_node(soup)
                      critical.parent.mkdir(parents=True,exist_ok=True)
                      critical.write_text(shell(title,clean_and_rewrite(node,url)),encoding='utf-8')
                  else: errors.append([url,'critical',r.status_code])
              except Exception as ex: errors.append([url,'critical',str(ex)])

          with open(OUT/'MIGRATION-MANIFEST.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['type','source_url','local_path','bytes']); w.writerows(manifest)
          with open(OUT/'MIGRATION-ERRORS.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['url','type','detail']); w.writerows(errors)
          (OUT/'EXTERNAL-VIDEO-LINKS.txt').write_text('\n'.join(sorted(external_videos)),encoding='utf-8')
          (OUT/'MIGRATION-SUMMARY.txt').write_text(f'Pages crawled: {len(seen)}\nAssets: {len(asset_seen)}\nAsset bytes: {total_asset_bytes}\nErrors: {len(errors)}\nCritical page present: {critical.exists()}\n',encoding='utf-8')
          print((OUT/'MIGRATION-SUMMARY.txt').read_text())
          if not critical.exists(): raise SystemExit('Critical official notice page was not generated')
          PY
          python /tmp/build.py

      - name: Publish generated pages into repository root
        run: |
          rm -rf sk
          rm -rf assets/migrated
          cp -R idsk-full/sk ./sk
          mkdir -p assets
          cp -R idsk-full/assets/migrated ./assets/migrated
          cp idsk-full/idsk.css ./idsk.css
          cp idsk-full/index.html ./index.html
          cp idsk-full/MIGRATION-SUMMARY.txt ./MIGRATION-SUMMARY.txt
          cp idsk-full/MIGRATION-MANIFEST.csv ./MIGRATION-MANIFEST.csv
          cp idsk-full/MIGRATION-ERRORS.csv ./MIGRATION-ERRORS.csv

      - name: Commit migrated IDSK site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html idsk.css sk assets/migrated MIGRATION-SUMMARY.txt MIGRATION-MANIFEST.csv MIGRATION-ERRORS.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Publish complete Ochodnica content in IDSK layout'
          git push

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ochodnica-full-idsk-site-v2
          path: idsk-full
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
