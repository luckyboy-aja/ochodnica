name: Build complete Ochodnica site in IDSK layout

on:
  push:
    paths:
      - '.github/workflows/build-full-idsk-site-v3.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ochodnica-complete-migration-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install crawler dependencies
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Crawl original site, download content and build IDSK site
        shell: bash
        run: |
          cat > /tmp/build_ochodnica.py <<'PY'
          import csv
          import hashlib
          import html
          import mimetypes
          import os
          import random
          import re
          import time
          import xml.etree.ElementTree as ET
          from collections import deque
          from email.utils import parsedate_to_datetime
          from pathlib import Path
          from urllib.parse import parse_qsl, urlencode, urljoin, urlsplit, urlunsplit, unquote

          import requests
          from bs4 import BeautifulSoup

          ROOT = 'https://www.ochodnica.sk/'
          HOSTS = {'ochodnica.sk', 'www.ochodnica.sk'}
          OUT = Path('idsk-full')
          ASSETS = OUT / 'assets' / 'migrated'
          OUT.mkdir(parents=True, exist_ok=True)
          ASSETS.mkdir(parents=True, exist_ok=True)

          MAX_PAGES = 5000
          MAX_ASSETS = 18000
          MAX_ASSET_BYTES = 95 * 1024 * 1024
          MAX_TOTAL_BYTES = 950 * 1024 * 1024
          DEADLINE = time.time() + 43 * 60

          # Polite crawling: one request at a time with a minimum delay and jitter.
          MIN_REQUEST_INTERVAL = 0.85
          JITTER = 0.35
          MAX_429_RETRIES = 7
          MAX_TRANSIENT_RETRIES = 5
          TRANSIENT = {500, 502, 503, 504}

          TRACKING = {
              'fbclid', 'gclid', 'dclid', 'msclkid',
              'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content',
              '_ga', '_gl'
          }
          DOC = {'.pdf', '.doc', '.docx', '.xls', '.xlsx', '.ppt', '.pptx', '.odt', '.ods', '.rtf', '.csv', '.zip', '.rar', '.7z'}
          IMG = {'.jpg', '.jpeg', '.png', '.gif', '.webp', '.svg', '.avif', '.bmp', '.tif', '.tiff'}
          MEDIA = {'.mp3', '.wav', '.ogg', '.m4a', '.aac', '.mp4', '.webm', '.mov', '.m4v', '.avi', '.mpeg', '.mpg'}
          ASSET_EXT = DOC | IMG | MEDIA | {'.ico'}

          MANDATORY = [
              ROOT,
              ROOT + 'sk/uradne-oznamy/',
              ROOT + 'sk/uradne-oznamy/2026/',
              ROOT + 'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html',
              ROOT + 'sk/kategoria/novinky-z-obce/',
              ROOT + 'sk/obecny-urad.html',
              ROOT + 'sk/o-obci/',
              ROOT + 'sk/samosprava/',
              ROOT + 'sk/obcan-a-podnikatel/'
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'NESS-Zilina-Ochodnica-content-migration/3.0 (+https://www.ness.com/)',
              'Accept-Language': 'sk,en;q=0.8'
          })

          queue = deque()
          queued = set()
          seen = set()
          generated = {}
          asset_map = {}
          asset_bytes = 0
          manifest = []
          errors = []
          unresolved_transient = set()
          external_videos = set()
          last_request_at = 0.0
          request_count = 0
          NAV = []
          BRAND_LOGO = None

          def host_ok(url):
              return urlsplit(url).netloc.lower().split(':')[0] in HOSTS

          def clean_query(query, whitelist=None):
              pairs = []
              for k, v in parse_qsl(query, keep_blank_values=True):
                  if k.lower() in TRACKING:
                      continue
                  if whitelist is not None and k.lower() not in whitelist:
                      continue
                  if len(k) <= 80 and len(v) <= 240:
                      pairs.append((k, v))
              return urlencode(sorted(pairs))

          def canonical_page(raw, base=ROOT):
              if not raw or str(raw).startswith(('mailto:', 'tel:', 'javascript:', 'data:', 'blob:', '#')):
                  return None
              u = urljoin(base, str(raw).strip())
              p = urlsplit(u)
              if p.scheme not in ('http', 'https') or not host_ok(u):
                  if any(x in p.netloc.lower() for x in ('youtube.com', 'youtu.be', 'vimeo.com')):
                      external_videos.add(u)
                  return None
              path = re.sub(r'/+', '/', p.path or '/')
              return urlunsplit(('https', 'www.ochodnica.sk', path, clean_query(p.query), ''))

          def canonical_asset(raw, base=ROOT):
              if not raw or str(raw).startswith(('mailto:', 'tel:', 'javascript:', 'data:', 'blob:', '#')):
                  return None
              u = urljoin(base, str(raw).strip())
              p = urlsplit(u)
              if p.scheme not in ('http', 'https') or not host_ok(u):
                  return None
              path = re.sub(r'/+', '/', p.path or '/')
              # Keep functional asset query parameters; remove only tracking parameters.
              return urlunsplit(('https', 'www.ochodnica.sk', path, clean_query(p.query), ''))

          def url_ext(url):
              return Path(urlsplit(url).path).suffix.lower()

          def known_asset(url):
              return url_ext(url) in ASSET_EXT

          def looks_like_download(url):
              p = urlsplit(url)
              text = (p.path + '?' + p.query).lower()
              return known_asset(url) or any(k in text for k in ('download', 'stiahn', 'subor', 'súbor', 'priloha', 'príloha', 'attachment', 'document', 'dokument'))

          def throttle():
              global last_request_at
              now = time.monotonic()
              wait = MIN_REQUEST_INTERVAL + random.uniform(0, JITTER) - (now - last_request_at)
              if wait > 0:
                  time.sleep(wait)
              last_request_at = time.monotonic()

          def retry_after_seconds(value):
              if not value:
                  return None
              try:
                  return max(0.0, float(value))
              except Exception:
                  pass
              try:
                  dt = parsedate_to_datetime(value)
                  return max(0.0, dt.timestamp() - time.time())
              except Exception:
                  return None

          def request(url, *, timeout=(10, 40), stream=False, purpose='page'):
              global request_count
              transient_attempt = 0
              rate_attempt = 0
              while time.time() < DEADLINE:
                  throttle()
                  request_count += 1
                  try:
                      r = session.get(url, timeout=timeout, allow_redirects=True, stream=stream)
                  except (requests.Timeout, requests.ConnectionError) as ex:
                      transient_attempt += 1
                      if transient_attempt > MAX_TRANSIENT_RETRIES:
                          unresolved_transient.add(url)
                          errors.append([url, purpose, 'connection', repr(ex)])
                          return None
                      delay = min(45, 3 * (2 ** (transient_attempt - 1))) + random.uniform(0, 2)
                      print(f'[retry connection] {url} in {delay:.1f}s', flush=True)
                      time.sleep(delay)
                      continue

                  if r.status_code == 429:
                      rate_attempt += 1
                      if rate_attempt > MAX_429_RETRIES:
                          unresolved_transient.add(url)
                          errors.append([url, purpose, 429, 'retry-exhausted'])
                          r.close()
                          return None
                      retry_after = retry_after_seconds(r.headers.get('Retry-After'))
                      delay = retry_after if retry_after is not None else min(120, 8 * (2 ** (rate_attempt - 1)))
                      delay = min(150, delay) + random.uniform(0.5, 3.0)
                      print(f'[429] {url} -> waiting {delay:.1f}s (attempt {rate_attempt}/{MAX_429_RETRIES})', flush=True)
                      r.close()
                      time.sleep(delay)
                      continue

                  if r.status_code in TRANSIENT:
                      transient_attempt += 1
                      if transient_attempt > MAX_TRANSIENT_RETRIES:
                          unresolved_transient.add(url)
                          errors.append([url, purpose, r.status_code, 'retry-exhausted'])
                          r.close()
                          return None
                      delay = min(60, 4 * (2 ** (transient_attempt - 1))) + random.uniform(0.5, 2.5)
                      print(f'[{r.status_code}] {url} -> waiting {delay:.1f}s', flush=True)
                      r.close()
                      time.sleep(delay)
                      continue

                  return r
              errors.append([url, purpose, 'deadline', 'not-fetched'])
              unresolved_transient.add(url)
              return None

          def enqueue(raw, base=ROOT):
              if len(queued) + len(seen) >= MAX_PAGES:
                  return
              u = canonical_page(raw, base)
              if not u or u in queued or u in seen or known_asset(u):
                  return
              queued.add(u)
              queue.append(u)

          for u in MANDATORY:
              enqueue(u)

          def slug_path(url):
              p = urlsplit(url)
              path = unquote(p.path).strip('/')
              if not path:
                  base = Path('index.html')
              else:
                  e = Path(path).suffix.lower()
                  if e in {'.html', '.htm'}:
                      base = Path(path)
                  elif e in {'.php', '.asp', '.aspx'}:
                      base = Path(path + '.html')
                  elif e:
                      base = Path(path + '.html')
                  else:
                      base = Path(path) / 'index.html'
              if p.query:
                  qh = hashlib.sha1(p.query.encode()).hexdigest()[:12]
                  if base.name == 'index.html':
                      base = base.parent / f'page--q-{qh}.html'
                  else:
                      base = base.with_name(base.stem + f'--q-{qh}' + base.suffix)
              return base

          def page_href(url):
              s = str(slug_path(url)).replace('\\', '/')
              if s.endswith('/index.html'):
                  s = s[:-10]
              elif s == 'index.html':
                  s = ''
              return '/ochodnica/' + s

          def safe_filename(url, response=None):
              name = os.path.basename(unquote(urlsplit(url).path))
              cd = response.headers.get('Content-Disposition', '') if response is not None else ''
              m = re.search(r'filename\*?=(?:UTF-8\x27\x27)?["\x27]?([^"\x27;]+)', cd, re.I)
              if m:
                  name = unquote(m.group(1).strip())
              ctype = (response.headers.get('Content-Type', '').split(';')[0].strip().lower() if response is not None else '')
              if not Path(name).suffix and ctype:
                  guessed = mimetypes.guess_extension(ctype) or ''
                  if guessed == '.jpe':
                      guessed = '.jpg'
                  name = (name or 'file') + guessed
              if not name:
                  name = 'file.bin'
              name = re.sub(r'[^A-Za-z0-9._-]+', '_', name)[:150]
              return hashlib.sha1(url.encode()).hexdigest()[:12] + '_' + name

          def folder_for(url, response=None):
              e = url_ext(url)
              ctype = response.headers.get('Content-Type', '').lower() if response is not None else ''
              if e in IMG or ctype.startswith('image/'):
                  return 'images'
              if e in DOC or any(x in ctype for x in ('pdf', 'word', 'excel', 'spreadsheet', 'powerpoint', 'presentation', 'zip', 'rar', '7z', 'rtf', 'csv', 'opendocument')):
                  return 'documents'
              if e in MEDIA or ctype.startswith(('audio/', 'video/')):
                  return 'media'
              return 'misc'

          def store_response_as_asset(url, r):
              global asset_bytes
              key = canonical_asset(url) or url
              if key in asset_map:
                  try:
                      r.close()
                  except Exception:
                      pass
                  return asset_map[key]
              data = r.content
              size = len(data)
              if size > MAX_ASSET_BYTES or asset_bytes + size > MAX_TOTAL_BYTES:
                  errors.append([url, 'asset', 'size-limit', size])
                  return None
              folder = folder_for(url, r)
              dest_dir = ASSETS / folder
              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / safe_filename(key, r)
              dest.write_bytes(data)
              asset_bytes += size
              local = '/ochodnica/' + str(dest.relative_to(OUT)).replace('\\', '/')
              asset_map[key] = local
              manifest.append(['asset', key, str(dest.relative_to(OUT)).replace('\\', '/'), size, r.status_code])
              return local

          def save_asset(raw, base=ROOT):
              if len(asset_map) >= MAX_ASSETS or time.time() >= DEADLINE:
                  return None
              u = canonical_asset(raw, base)
              if not u:
                  return None
              if u in asset_map:
                  return asset_map[u]
              r = request(u, timeout=(10, 70), purpose='asset')
              if r is None:
                  return None
              if r.status_code >= 400:
                  errors.append([u, 'asset', r.status_code, 'original-response'])
                  r.close()
                  return None
              return store_response_as_asset(u, r)

          def parse_sitemap(data, depth=0):
              if depth > 4 or time.time() >= DEADLINE:
                  return
              try:
                  root = ET.fromstring(data)
              except Exception as ex:
                  errors.append(['sitemap', 'parse', 'xml', repr(ex)])
                  return
              locs = [x.text.strip() for x in root.iter() if x.tag.lower().endswith('loc') and x.text]
              if root.tag.lower().endswith('sitemapindex'):
                  for loc in locs[:250]:
                      if not host_ok(loc):
                          continue
                      r = request(loc, timeout=(10, 30), purpose='sitemap')
                      if r is not None and r.status_code == 200:
                          parse_sitemap(r.content, depth + 1)
                          r.close()
              else:
                  for loc in locs:
                      if known_asset(loc):
                          # Downloading is deferred until referenced, but sitemap asset remains discoverable in manifest.
                          manifest.append(['sitemap-asset', loc, '', '', 'discovered'])
                      else:
                          enqueue(loc)

          def seed_sitemaps():
              candidates = [ROOT + 'sitemap.xml', ROOT + 'sitemap_index.xml']
              rr = request(ROOT + 'robots.txt', timeout=(10, 25), purpose='robots')
              if rr is not None and rr.status_code == 200:
                  for line in rr.text.splitlines():
                      if line.lower().startswith('sitemap:'):
                          candidates.append(line.split(':', 1)[1].strip())
                  rr.close()
              for url in dict.fromkeys(candidates):
                  if not host_ok(url):
                      continue
                  r = request(url, timeout=(10, 30), purpose='sitemap')
                  if r is not None and r.status_code == 200:
                      parse_sitemap(r.content)
                      r.close()

          def discover_navigation(soup, base):
              global NAV
              if NAV:
                  return
              candidates = soup.select('nav, .nav, .navigation, .menu, #menu, .main-menu, .navbar')
              best = []
              for node in candidates:
                  items = []
                  used = set()
                  for a in node.select('a[href]'):
                      label = ' '.join(a.stripped_strings)
                      u = canonical_page(a.get('href'), base)
                      if not label or not u or known_asset(u):
                          continue
                      key = (label, u)
                      if key in used:
                          continue
                      used.add(key)
                      items.append((label[:45], page_href(u)))
                  if 4 <= len(items) <= 20 and len(items) > len(best):
                      best = items
              if best:
                  NAV = best[:12]

          def discover_brand_logo(soup, base):
              global BRAND_LOGO
              if BRAND_LOGO:
                  return
              for sel in ('header .logo img', 'header img.logo', '.logo img', 'header img', '.brand img'):
                  img = soup.select_one(sel)
                  if img:
                      raw = img.get('src') or img.get('data-src') or img.get('data-original')
                      if raw:
                          local = save_asset(raw, base)
                          if local:
                              BRAND_LOGO = local
                              return

          def discover_links(soup, base):
              for a in soup.select('a[href]'):
                  raw = a.get('href')
                  u = canonical_page(raw, base)
                  if not u:
                      continue
                  if known_asset(u):
                      continue
                  enqueue(u)

          def choose_main(soup):
              selectors = [
                  'main', 'article', '.page-content', '.article-content', '.entry-content',
                  '.content-main', '#content-main', '#content', '.main-content', '.content'
              ]
              scored = []
              for sel in selectors:
                  for node in soup.select(sel):
                      text_len = len(node.get_text(' ', strip=True))
                      if text_len >= 30:
                          scored.append((text_len, node))
                  if scored:
                      # Prefer a meaningful node from an earlier, more specific selector.
                      return max(scored, key=lambda x: x[0])[1]
              return soup.body or soup

          def title_for(soup):
              for sel in ('h1', '.page-title', '.article-title', '.entry-title'):
                  x = soup.select_one(sel)
                  if x and x.get_text(' ', strip=True):
                      return x.get_text(' ', strip=True)
              if soup.title:
                  t = soup.title.get_text(' ', strip=True)
                  t = re.sub(r'\s*[|–-]\s*(Obec\s+)?Ochodnica.*$', '', t, flags=re.I).strip()
                  if t:
                      return t
              return 'Obec Ochodnica'

          def rewrite_srcset(value, base):
              out = []
              for part in value.split(','):
                  part = part.strip()
                  if not part:
                      continue
                  bits = part.split()
                  raw = bits[0]
                  local = save_asset(raw, base)
                  if local:
                      out.append(' '.join([local] + bits[1:]))
              return ', '.join(out)

          def rewrite_style_urls(style, base):
              def repl(m):
                  raw = m.group(1).strip(' "\'')
                  local = save_asset(raw, base)
                  return f'url("{local}")' if local else m.group(0)
              return re.sub(r'url\(([^)]+)\)', repl, style, flags=re.I)

          def clean_and_rewrite(node, base):
              for x in node.select('script,style,noscript,nav,footer,header,.cookie,.cookies,.cookiebar,.breadcrumb,.breadcrumbs'):
                  x.decompose()

              for tag in node.find_all(True):
                  if tag.has_attr('style') and 'url(' in tag.get('style', '').lower():
                      tag['style'] = rewrite_style_urls(tag['style'], base)

                  if tag.name == 'img':
                      raw = tag.get('src') or tag.get('data-src') or tag.get('data-original') or tag.get('data-lazy-src')
                      if raw:
                          local = save_asset(raw, base)
                          if local:
                              tag['src'] = local
                      srcset = tag.get('srcset') or tag.get('data-srcset')
                      if srcset:
                          rewritten = rewrite_srcset(srcset, base)
                          if rewritten:
                              tag['srcset'] = rewritten
                      for attr in ('data-src', 'data-original', 'data-lazy-src', 'data-srcset'):
                          tag.attrs.pop(attr, None)

                  elif tag.name == 'source':
                      if tag.get('src'):
                          local = save_asset(tag.get('src'), base)
                          if local:
                              tag['src'] = local
                      if tag.get('srcset'):
                          rewritten = rewrite_srcset(tag.get('srcset'), base)
                          if rewritten:
                              tag['srcset'] = rewritten

                  elif tag.name in ('video', 'audio'):
                      if tag.get('src'):
                          local = save_asset(tag.get('src'), base)
                          if local:
                              tag['src'] = local
                      if tag.get('poster'):
                          local = save_asset(tag.get('poster'), base)
                          if local:
                              tag['poster'] = local

                  elif tag.name == 'a' and tag.get('href'):
                      raw = tag.get('href')
                      p = urlsplit(urljoin(base, raw))
                      if p.netloc.lower().split(':')[0] not in HOSTS:
                          continue
                      u = canonical_asset(raw, base)
                      if not u:
                          continue
                      if known_asset(u) or looks_like_download(u):
                          local = save_asset(u, base)
                          if local:
                              tag['href'] = local
                          continue
                      page_u = canonical_page(raw, base)
                      if page_u:
                          tag['data-original-internal'] = page_u
                          tag['href'] = page_href(page_u)

              return str(node)

          CSS = r'''
          :root{--idsk-blue:#004d99;--idsk-dark:#1d2d44;--idsk-nav:#003b73;--text:#1b1f23;--muted:#58636f;--line:#d8dde3;--soft:#f3f5f7;--focus:#ffdf0f;--white:#fff}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;color:var(--text);line-height:1.56;background:#fff}a{color:#005ea8;text-underline-offset:3px}.wrap{width:min(1180px,calc(100% - 32px));margin:0 auto}.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;background:var(--focus);color:#111;padding:12px 16px;z-index:9999}.gov{background:#f2f4f6;border-bottom:1px solid var(--line);font-size:14px}.gov .wrap{padding:9px 0;color:#38424d}.head{padding:24px 0;background:#fff}.brand{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--text)}.brand-logo{width:66px;max-height:76px;object-fit:contain}.crest-fallback{width:58px;height:66px;border-radius:12px 12px 20px 20px;background:var(--idsk-blue);color:#fff;display:grid;place-items:center;font-size:27px;font-weight:800}.brand strong{display:block;font-size:28px;line-height:1.15}.brand small{display:block;color:var(--muted);margin-top:4px}.nav{background:var(--idsk-nav);border-bottom:4px solid #0070c9}.nav .wrap{display:flex;flex-wrap:wrap}.nav a{color:#fff;text-decoration:none;padding:15px 16px;font-weight:700}.nav a:hover{background:var(--idsk-blue)}main{padding:42px 0 72px;min-height:560px}.crumb{font-size:14px;color:#67727e;margin-bottom:22px}.kicker{text-transform:uppercase;letter-spacing:.075em;font-size:13px;font-weight:800;color:var(--idsk-blue)}h1{font-size:clamp(32px,5vw,50px);line-height:1.12;margin:8px 0 26px}h2{font-size:28px;line-height:1.2;margin-top:36px}h3{font-size:22px;line-height:1.25}.content{font-size:17px;overflow-wrap:anywhere}.content img{max-width:100%;height:auto}.content figure{max-width:100%;margin:24px 0}.content iframe,.content video{max-width:100%}.content table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}.content td,.content th{border:1px solid var(--line);padding:9px 11px;vertical-align:top}.content blockquote{border-left:5px solid var(--idsk-blue);padding:10px 18px;background:var(--soft);margin-left:0}.content a[href*="/assets/migrated/documents/"]{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-left:4px solid var(--idsk-blue);margin:4px 0;text-decoration:none}.footer{background:#202a34;color:#fff;padding:42px 0 20px}.footer a{color:#fff}.footgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:36px}.footgrid>div{display:flex;flex-direction:column;gap:7px}.footbottom{border-top:1px solid #4a5661;margin-top:30px;padding-top:18px;color:#d5d9dd;font-size:14px}.ness{font-weight:700;color:#fff}a:focus,button:focus,input:focus,select:focus,textarea:focus{outline:4px solid var(--focus);outline-offset:2px}@media(max-width:820px){.nav .wrap{flex-direction:column}.nav a{border-bottom:1px solid rgba(255,255,255,.16)}.brand strong{font-size:23px}.footgrid{grid-template-columns:1fr}main{padding-top:30px}}
          '''
          (OUT / 'idsk.css').write_text(CSS, encoding='utf-8')

          FALLBACK_NAV = [
              ('Domov', '/ochodnica/'),
              ('Obec', '/ochodnica/sk/o-obci/'),
              ('Samospráva', '/ochodnica/sk/samosprava/'),
              ('Aktuality', '/ochodnica/sk/kategoria/novinky-z-obce/'),
              ('Úradné oznamy', '/ochodnica/sk/uradne-oznamy/'),
              ('Ako vybaviť', '/ochodnica/sk/obcan-a-podnikatel/'),
              ('Kontakt', '/ochodnica/sk/obecny-urad.html')
          ]

          def shell(title, content):
              nav_items = NAV or FALLBACK_NAV
              nav_html = ''.join(f'<a href="{html.escape(u, quote=True)}">{html.escape(t)}</a>' for t, u in nav_items)
              logo_html = (f'<img class="brand-logo" src="{html.escape(BRAND_LOGO, quote=True)}" alt="Erb obce Ochodnica">' if BRAND_LOGO else '<span class="crest-fallback" aria-hidden="true">O</span>')
              safe_title = html.escape(title)
              return f'''<!doctype html>
          <html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="generator" content="NESS Žilina – webové riešenie podľa IDSK"><title>{safe_title} – Obec Ochodnica</title><link rel="stylesheet" href="/ochodnica/idsk.css"></head>
          <body><a class="skip" href="#main">Preskočiť na obsah</a>
          <div class="gov"><div class="wrap">Verejná správa Slovenskej republiky</div></div>
          <header class="head"><div class="wrap"><a class="brand" href="/ochodnica/">{logo_html}<span><strong>Obec Ochodnica</strong><small>webové sídlo obce</small></span></a></div></header>
          <nav class="nav" aria-label="Hlavná navigácia"><div class="wrap">{nav_html}</div></nav>
          <main id="main"><div class="wrap"><div class="crumb"><a href="/ochodnica/">Domov</a> › {safe_title}</div><span class="kicker">Obec Ochodnica</span><h1>{safe_title}</h1><div class="content">{content}</div></div></main>
          <footer class="footer"><div class="wrap"><div class="footgrid"><div><strong>Obec Ochodnica</strong><span>Ochodnica 121, 023 35 Ochodnica</span><span>IČO: 00314153</span></div><div><strong>Kontakt</strong><a href="tel:+421414233121">041 / 423 31 21</a><a href="mailto:obec@ochodnica.sk">obec@ochodnica.sk</a></div><div><strong>Webové sídlo</strong><span>Technické riešenie a realizácia</span><span class="ness">NESS Žilina</span></div></div><div class="footbottom">© Obec Ochodnica · Webové riešenie podľa princípov IDSK · Realizácia: NESS Žilina</div></div></footer>
          </body></html>'''

          def process_page(url):
              if time.time() >= DEADLINE:
                  return
              r = request(url, timeout=(10, 45), purpose='page')
              if r is None:
                  return
              if r.status_code >= 400:
                  # Preserve original 4xx as a warning; do not fabricate content.
                  errors.append([url, 'page', r.status_code, 'original-response'])
                  r.close()
                  return

              ctype = r.headers.get('Content-Type', '').lower()
              if 'text/html' not in ctype and 'application/xhtml+xml' not in ctype and not ctype.startswith('text/'):
                  local = store_response_as_asset(url, r)
                  if local:
                      print(f'[binary target] {url} -> {local}', flush=True)
                  return

              raw_html = r.text
              final_url = canonical_page(r.url) or url
              soup = BeautifulSoup(raw_html, 'html.parser')

              if url == ROOT or final_url == ROOT:
                  discover_navigation(soup, final_url)
                  discover_brand_logo(soup, final_url)

              discover_links(soup, final_url)
              title = title_for(soup)
              node = choose_main(soup)
              content = clean_and_rewrite(node, final_url)
              dest = OUT / slug_path(url)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(shell(title, content), encoding='utf-8')
              generated[url] = dest
              manifest.append(['page', url, str(dest.relative_to(OUT)).replace('\\', '/'), len(raw_html.encode('utf-8')), r.status_code])
              r.close()

          seed_sitemaps()

          while queue and len(seen) < MAX_PAGES and time.time() < DEADLINE:
              url = queue.popleft()
              queued.discard(url)
              if url in seen:
                  continue
              seen.add(url)
              print(f'[{len(seen)} pages, {len(asset_map)} assets] {url}', flush=True)
              process_page(url)

          # Explicit second pass for anything that exhausted a 429/5xx/connection retry.
          if unresolved_transient and time.time() < DEADLINE - 60:
              retry_urls = list(unresolved_transient)
              unresolved_transient.clear()
              print(f'Second pass for {len(retry_urls)} transient failures; cooling down first.', flush=True)
              time.sleep(20 + random.uniform(0, 5))
              for url in retry_urls:
                  if time.time() >= DEADLINE:
                      unresolved_transient.add(url)
                      break
                  if known_asset(url) or url in asset_map:
                      save_asset(url)
                  else:
                      process_page(url)

          # Rewrite links that turned out to be binary/download targets after they were discovered.
          for page in OUT.rglob('*.html'):
              soup = BeautifulSoup(page.read_text(encoding='utf-8'), 'html.parser')
              changed = False
              for a in soup.select('a[data-original-internal]'):
                  original = a.get('data-original-internal')
                  asset_key = canonical_asset(original)
                  if asset_key in asset_map:
                      a['href'] = asset_map[asset_key]
                      changed = True
                  a.attrs.pop('data-original-internal', None)
                  changed = True
              if changed:
                  page.write_text(str(soup), encoding='utf-8')

          # Ensure the exact requested official notice exists.
          critical_url = ROOT + 'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html'
          critical_path = OUT / 'sk/uradne-oznamy/2026/oznamenie-o-akcii-29-30-08-2026.html'
          if not critical_path.exists() and time.time() < DEADLINE:
              print('Critical notice missing after crawl; fetching it directly.', flush=True)
              process_page(critical_url)

          # Validate local references and completeness of all successfully fetched generated pages/assets.
          missing_local = []
          for page in OUT.rglob('*.html'):
              soup = BeautifulSoup(page.read_text(encoding='utf-8'), 'html.parser')
              for tag, attr in [('a', 'href'), ('img', 'src'), ('source', 'src'), ('video', 'src'), ('audio', 'src')]:
                  for el in soup.find_all(tag):
                      value = el.get(attr)
                      if not value or not value.startswith('/ochodnica/'):
                          continue
                      rel = value[len('/ochodnica/'):].split('?', 1)[0].split('#', 1)[0]
                      if not rel:
                          target = OUT / 'index.html'
                      else:
                          target = OUT / rel
                          if value.endswith('/'):
                              target = target / 'index.html'
                      # Navigation can point to original pages not discovered yet only if original is missing/404.
                      if not target.exists():
                          missing_local.append([str(page.relative_to(OUT)), value])

          # Do not block on fallback navigation links alone; fail on broken migrated assets and generated-content links.
          broken_assets = [x for x in missing_local if '/assets/migrated/' in x[1]]
          missing_generated_pages = []
          for url, dest in generated.items():
              if not dest.exists():
                  missing_generated_pages.append(url)

          with (OUT / 'MIGRATION-MANIFEST.csv').open('w', newline='', encoding='utf-8-sig') as f:
              w = csv.writer(f)
              w.writerow(['type', 'source_url', 'local_path', 'bytes', 'status'])
              w.writerows(manifest)

          with (OUT / 'MIGRATION-ERRORS.csv').open('w', newline='', encoding='utf-8-sig') as f:
              w = csv.writer(f)
              w.writerow(['url', 'type', 'status', 'detail'])
              for row in errors:
                  w.writerow((row + [''])[:4])

          with (OUT / 'MISSING-LOCAL-LINKS.csv').open('w', newline='', encoding='utf-8-sig') as f:
              w = csv.writer(f)
              w.writerow(['page', 'target'])
              w.writerows(missing_local)

          (OUT / 'EXTERNAL-VIDEO-LINKS.txt').write_text('\n'.join(sorted(external_videos)), encoding='utf-8')

          summary = [
              'Ochodnica – úplná migrácia obsahu do IDSK vzhľadu',
              f'Generated HTML pages: {len(generated)}',
              f'Downloaded assets: {len(asset_map)}',
              f'Downloaded asset bytes: {asset_bytes}',
              f'HTTP requests: {request_count}',
              f'Crawler errors/warnings: {len(errors)}',
              f'Unresolved transient/429 failures: {len(unresolved_transient)}',
              f'Broken migrated asset references: {len(broken_assets)}',
              f'Missing generated page files: {len(missing_generated_pages)}',
              f'Critical official notice present: {critical_path.exists()}',
              'Branding: NESS Žilina',
              'Publication policy: publish only after validation passes.'
          ]
          (OUT / 'MIGRATION-SUMMARY.txt').write_text('\n'.join(summary) + '\n', encoding='utf-8')
          print('\n'.join(summary), flush=True)

          # Guarded publication: unresolved rate-limit/transient failures or broken migrated files stop deployment.
          if unresolved_transient:
              raise SystemExit(f'Validation failed: {len(unresolved_transient)} unresolved 429/transient URLs remain.')
          if broken_assets:
              raise SystemExit(f'Validation failed: {len(broken_assets)} migrated asset references are broken.')
          if missing_generated_pages:
              raise SystemExit(f'Validation failed: {len(missing_generated_pages)} generated pages are missing.')
          if not critical_path.exists():
              raise SystemExit('Validation failed: critical official notice page was not generated.')
          if len(generated) < 10:
              raise SystemExit('Validation failed: suspiciously few pages were generated; refusing to replace the live site.')
          PY
          python /tmp/build_ochodnica.py

      - name: Save validated site into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sk assets/migrated
          cp -a idsk-full/sk ./sk
          mkdir -p assets
          cp -a idsk-full/assets/migrated ./assets/migrated
          cp idsk-full/index.html ./index.html
          cp idsk-full/idsk.css ./idsk.css
          cp idsk-full/MIGRATION-MANIFEST.csv ./MIGRATION-MANIFEST.csv
          cp idsk-full/MIGRATION-ERRORS.csv ./MIGRATION-ERRORS.csv
          cp idsk-full/MISSING-LOCAL-LINKS.csv ./MISSING-LOCAL-LINKS.csv
          cp idsk-full/MIGRATION-SUMMARY.txt ./MIGRATION-SUMMARY.txt
          cp idsk-full/EXTERNAL-VIDEO-LINKS.txt ./EXTERNAL-VIDEO-LINKS.txt

          git config user.name "NESS Zilina migration bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html idsk.css sk assets/migrated MIGRATION-MANIFEST.csv MIGRATION-ERRORS.csv MISSING-LOCAL-LINKS.csv MIGRATION-SUMMARY.txt EXTERNAL-VIDEO-LINKS.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated complete Ochodnica content in IDSK layout"
            git push origin HEAD:main
          else
            echo "Validated site is unchanged; nothing to commit."
          fi

      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: idsk-full

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
