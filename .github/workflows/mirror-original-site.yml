name: Mirror original Ochodnica website

on:
  push:
    paths:
      - '.github/workflows/mirror-original-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ochodnica-site-mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install crawler dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4

      - name: Crawl complete public site with bounded URLs
        shell: bash
        run: |
          cat > /tmp/mirror.py <<'PY'
          import csv
          import hashlib
          import os
          import re
          import time
          from collections import deque
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urlunsplit, unquote
          import xml.etree.ElementTree as ET

          import requests
          from bs4 import BeautifulSoup

          ROOT = 'https://www.ochodnica.sk/'
          ALLOWED_HOSTS = {'www.ochodnica.sk', 'ochodnica.sk'}
          OUT = Path('mirror')
          OUT.mkdir(parents=True, exist_ok=True)

          MAX_PAGES = 3000
          MAX_ASSETS = 15000
          MAX_FILE_BYTES = 120 * 1024 * 1024
          MAX_TOTAL_BYTES = 2 * 1024 * 1024 * 1024
          DEADLINE = time.time() + 18 * 60
          WORKERS = 10

          PAGE_EXTS = {'', '.html', '.htm', '.php', '.asp', '.aspx'}
          ASSET_EXTS = {
              '.css','.js','.mjs','.json','.xml','.txt','.ico','.svg',
              '.jpg','.jpeg','.png','.gif','.webp','.avif','.bmp','.tif','.tiff',
              '.woff','.woff2','.ttf','.otf','.eot',
              '.pdf','.doc','.docx','.xls','.xlsx','.ppt','.pptx','.odt','.ods','.rtf','.csv',
              '.zip','.rar','.7z','.gz','.tar',
              '.mp3','.wav','.ogg','.m4a','.aac',
              '.mp4','.webm','.mov','.m4v','.avi','.mpeg','.mpg'
          }
          SKIP_SCHEMES = ('mailto:', 'tel:', 'javascript:', 'data:', 'blob:')
          TRACKING_KEYS = {'fbclid','gclid','utm_source','utm_medium','utm_campaign','utm_term','utm_content'}

          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (compatible; Ochodnica migration crawler/2.0)'})

          page_queue = deque()
          queued_pages = set()
          visited_pages = set()
          asset_urls = set()
          external_videos = set()
          manifest = []
          errors = []
          total_bytes = 0

          def canonical(raw, base=ROOT):
              if not raw or raw.startswith(SKIP_SCHEMES):
                  return None
              u = urljoin(base, raw)
              p = urlsplit(u)
              if p.scheme not in ('http','https'):
                  return None
              host = p.netloc.lower().split(':')[0]
              if host not in ALLOWED_HOSTS:
                  if any(x in host for x in ('youtube.com','youtu.be','vimeo.com')):
                      external_videos.add(u)
                  return None
              path = re.sub(r'/+', '/', p.path or '/')
              # Drop all query parameters for crawl identity. On this CMS they mainly
              # create duplicate views; the public content is addressable by paths.
              return urlunsplit(('https','www.ochodnica.sk',path,'',''))

          def ext_of(url):
              return Path(urlsplit(url).path).suffix.lower()

          def is_asset(url):
              return ext_of(url) in ASSET_EXTS

          def local_path(url, content_type=''):
              p = urlsplit(url)
              path = unquote(p.path or '/')
              path = re.sub(r'[^A-Za-z0-9._/\-]+', '_', path)
              path = path.lstrip('/')
              ext = Path(path).suffix.lower()
              if not path:
                  path = 'index.html'
              elif path.endswith('/'):
                  path += 'index.html'
              elif ext in PAGE_EXTS:
                  if ext == '':
                      path += '/index.html'
                  elif ext in {'.php','.asp','.aspx'}:
                      path += '.html'
              elif ext == '' and 'text/html' in content_type:
                  path += '/index.html'
              return OUT / 'www.ochodnica.sk' / path

          def save_bytes(url, data, content_type, kind):
              global total_bytes
              if total_bytes + len(data) > MAX_TOTAL_BYTES:
                  raise RuntimeError('mirror size limit reached')
              p = local_path(url, content_type)
              p.parent.mkdir(parents=True, exist_ok=True)
              if p.exists() and p.read_bytes() == data:
                  return p
              p.write_bytes(data)
              total_bytes += len(data)
              manifest.append([kind, url, str(p.relative_to(OUT)), len(data), content_type])
              return p

          def fetch(url, stream=False):
              return session.get(url, timeout=(8, 25), allow_redirects=True, stream=stream)

          def enqueue_page(url):
              u = canonical(url)
              if not u or u in queued_pages or u in visited_pages or is_asset(u):
                  return
              if len(queued_pages) + len(visited_pages) >= MAX_PAGES:
                  return
              queued_pages.add(u)
              page_queue.append(u)

          def register_resource(raw, base):
              if not raw:
                  return
              # srcset entries can contain width descriptors
              raw = raw.strip().split()[0]
              u = canonical(raw, base)
              if not u:
                  return
              if is_asset(u):
                  if len(asset_urls) < MAX_ASSETS:
                      asset_urls.add(u)
              else:
                  enqueue_page(u)

          def discover_from_html(html, base):
              soup = BeautifulSoup(html, 'html.parser')
              for tag in soup.find_all(True):
                  if tag.name == 'a' and tag.get('href'):
                      register_resource(tag.get('href'), base)
                  for attr in ('src','href','poster','data-src','data-original'):
                      if attr in tag.attrs and not (tag.name == 'a' and attr == 'href'):
                          register_resource(tag.get(attr), base)
                  for attr in ('srcset','data-srcset'):
                      val = tag.get(attr)
                      if val:
                          for item in val.split(','):
                              register_resource(item, base)
                  style = tag.get('style') or ''
                  for m in re.findall(r'url\(["\']?([^"\')]+)', style, flags=re.I):
                      register_resource(m, base)
              for tag in soup.find_all(['iframe','a','video','source']):
                  u = tag.get('src') or tag.get('href')
                  if u:
                      host = urlsplit(urljoin(base,u)).netloc.lower()
                      if any(x in host for x in ('youtube.com','youtu.be','vimeo.com')):
                          external_videos.add(urljoin(base,u))

          def discover_from_css(text, base):
              for m in re.findall(r'url\(["\']?([^"\')]+)', text, flags=re.I):
                  register_resource(m, base)
              for m in re.findall(r'@import\s+["\']([^"\']+)', text, flags=re.I):
                  register_resource(m, base)

          def seed_sitemaps():
              enqueue_page(ROOT)
              for candidate in (ROOT+'sitemap.xml', ROOT+'sitemap_index.xml', ROOT+'robots.txt'):
                  try:
                      r = fetch(candidate)
                      if r.status_code != 200:
                          continue
                      if candidate.endswith('robots.txt'):
                          for line in r.text.splitlines():
                              if line.lower().startswith('sitemap:'):
                                  parse_sitemap(line.split(':',1)[1].strip())
                      else:
                          parse_sitemap(candidate, r.content)
                  except Exception as e:
                      errors.append([candidate, 'seed', str(e)])

          def parse_sitemap(url, content=None, depth=0):
              if depth > 3 or time.time() > DEADLINE:
                  return
              try:
                  if content is None:
                      r = fetch(url)
                      if r.status_code != 200:
                          return
                      content = r.content
                  root = ET.fromstring(content)
                  locs = [x.text.strip() for x in root.iter() if x.tag.lower().endswith('loc') and x.text]
                  if root.tag.lower().endswith('sitemapindex'):
                      for loc in locs[:50]:
                          parse_sitemap(loc, depth=depth+1)
                  else:
                      for loc in locs:
                          enqueue_page(loc)
              except Exception as e:
                  errors.append([url, 'sitemap', str(e)])

          seed_sitemaps()

          while page_queue and len(visited_pages) < MAX_PAGES and time.time() < DEADLINE:
              url = page_queue.popleft()
              queued_pages.discard(url)
              if url in visited_pages:
                  continue
              visited_pages.add(url)
              try:
                  r = fetch(url)
                  ctype = (r.headers.get('content-type') or '').lower()
                  if r.status_code >= 400:
                      errors.append([url, str(r.status_code), ''])
                      continue
                  data = r.content
                  if len(data) > MAX_FILE_BYTES:
                      errors.append([url, 'too-large', str(len(data))])
                      continue
                  final = canonical(r.url) or url
                  if 'text/html' in ctype or ext_of(final) in PAGE_EXTS:
                      save_bytes(final, data, ctype, 'page')
                      try:
                          discover_from_html(r.text, final)
                      except Exception as e:
                          errors.append([url, 'parse-html', str(e)])
                  else:
                      save_bytes(final, data, ctype, 'asset')
                  if len(visited_pages) % 100 == 0:
                      print(f'pages={len(visited_pages)} queued={len(page_queue)} assets={len(asset_urls)} bytes={total_bytes}', flush=True)
              except Exception as e:
                  errors.append([url, 'fetch', str(e)])

          # Download discovered assets concurrently. CSS is parsed for nested fonts/images.
          downloaded_assets = set()
          def download_asset(url):
              if time.time() > DEADLINE:
                  return None
              try:
                  r = fetch(url)
                  if r.status_code >= 400:
                      return (url, None, str(r.status_code))
                  data = r.content
                  if len(data) > MAX_FILE_BYTES:
                      return (url, None, 'too-large')
                  ctype = (r.headers.get('content-type') or '').lower()
                  p = save_bytes(canonical(r.url) or url, data, ctype, 'asset')
                  if ext_of(url) == '.css' or 'text/css' in ctype:
                      try:
                          discover_from_css(r.text, canonical(r.url) or url)
                      except Exception:
                          pass
                  return (url, p, None)
              except Exception as e:
                  return (url, None, str(e))

          rounds = 0
          while rounds < 4 and time.time() < DEADLINE:
              pending = [u for u in asset_urls if u not in downloaded_assets][:MAX_ASSETS-len(downloaded_assets)]
              if not pending:
                  break
              rounds += 1
              with ThreadPoolExecutor(max_workers=WORKERS) as ex:
                  futs = {ex.submit(download_asset,u):u for u in pending}
                  for fut in as_completed(futs):
                      u = futs[fut]
                      downloaded_assets.add(u)
                      try:
                          _, _, err = fut.result()
                          if err:
                              errors.append([u, 'asset', err])
                      except Exception as e:
                          errors.append([u, 'asset', str(e)])
                      if time.time() > DEADLINE:
                          break

          with open(OUT/'MIRROR-INVENTORY.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['type','source_url','local_path','bytes','content_type']); w.writerows(manifest)
          with open(OUT/'MIRROR-ERRORS.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['url','stage_or_status','detail']); w.writerows(errors)
          with open(OUT/'EXTERNAL-VIDEO-LINKS.txt','w',encoding='utf-8') as f:
              for u in sorted(external_videos): f.write(u+'\n')
          with open(OUT/'MIRROR-SUMMARY.txt','w',encoding='utf-8') as f:
              f.write('Public mirror of https://www.ochodnica.sk/\n')
              f.write(f'HTML pages fetched: {len(visited_pages)}\n')
              f.write(f'Assets downloaded/attempted: {len(downloaded_assets)}\n')
              f.write(f'Manifest entries: {len(manifest)}\n')
              f.write(f'Total downloaded bytes: {total_bytes}\n')
              f.write(f'External video links: {len(external_videos)}\n')
              f.write(f'Errors/non-200 records: {len(errors)}\n')
              f.write(f'Crawler asset rounds: {rounds}\n')
              f.write('URL query strings were intentionally discarded to prevent duplicate/infinite CMS variants.\n')

          print((OUT/'MIRROR-SUMMARY.txt').read_text(), flush=True)
          PY
          python /tmp/mirror.py

      - name: Show mirror size
        run: |
          du -sh mirror
          find mirror -type f | wc -l
          cat mirror/MIRROR-SUMMARY.txt

      - name: Upload full mirror
        uses: actions/upload-artifact@v4
        with:
          name: ochodnica-full-public-mirror
          path: mirror
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
